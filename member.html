<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member | The Minesa Studios</title>
    <meta name="description" content="Meet the people behind The Minesa Studios." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://theminesa.studio/team.html" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Member | The Minesa Studios" />
    <meta property="og:description" content="Meet the people behind The Minesa Studios." />
    <meta property="og:url" content="https://theminesa.studio/team.html" />
    <meta name="theme-color" content="#040405" />
    <link rel="stylesheet" href="style.css?v=9" />
    <link rel="stylesheet" href="member.css?v=8" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="expect" href="#member-ready" blocking="render" />
    <script>
      // Arriving by view transition, the page shows complete at once (no entrance fades), so
      // the morph doesn't start from a half-empty snapshot.
      addEventListener("pagereveal", (event) => {
        if (event.viewTransition) document.documentElement.classList.add("m-vt-in");
      });
    </script>
  </head>
  <body class="member-page">
    <a class="m-skip" href="#member">Skip to the profile</a>

    <header class="m-header">
      <a class="m-logo" href="./index.html" aria-label="The Minesa Studios home">
        <img src="./assets/navigation-assets/Logo.svg" alt="" width="52" height="51" />
      </a>

      <nav class="site-nav" aria-label="Main">
        <a class="site-nav__item site-nav__item--team is-current" href="./team.html">
          <img src="./assets/navigation-assets/TEAM%20STAMP.svg" alt="" width="50" height="50" />
          <span>Team</span>
        </a>
        <span class="site-nav__divider" aria-hidden="true"></span>
        <a class="site-nav__item site-nav__item--updates" href="./updates.html">
          <img src="./assets/navigation-assets/RELEASE%20STAMP.svg" alt="" width="50" height="50" />
          <span>Updates</span>
        </a>
      </nav>
    </header>

    <!-- Filled from data/members.js by member.js before the first paint. -->
    <main class="m-main" id="member" tabindex="-1"></main>
    <noscript><p class="m-missing">Turn on JavaScript to meet the team, or see <a href="./team.html">the team page</a>.</p></noscript>

    <script src="data/members.js?v=2"></script>
    <script src="member.js?v=5"></script>
    <span id="member-ready" hidden></span>
  </body>
</html>
